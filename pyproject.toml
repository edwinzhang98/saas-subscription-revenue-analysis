[project]
name = "saas-subscription-revenue-analysis"
version = "1.0.0"
description = "SaaS subscription revenue analysis: MRR/ARR/NRR/GRR metric layer, expansion & contraction diagnostics, silent-churn watchlist (synthetic data)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "duckdb>=1.1",
    "plotly>=5.24",
    "streamlit>=1.40",
    "pyyaml>=6",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "jinja2>=3.1",
    "kaleido>=1.0",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "tabulate>=0.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "playwright>=1.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saas_rev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
